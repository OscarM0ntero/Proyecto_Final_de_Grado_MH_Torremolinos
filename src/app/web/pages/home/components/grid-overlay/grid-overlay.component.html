<!-- Subcomponente del inicio, que contiene un grid para posicionar la segunda sección de imagen y texto -->
@if (contenido) {
  <div class="grid-overlay">
    <div class="grid-title">
      <h2>{{ contenido.titulo}}</h2>
    </div>
    <div class="grid-text">
      <div [innerHTML]="contenido.texto"></div>
    </div>
    <div class="grid-image">
      <img [src]="imagen">
    </div>
    <div class="spacer-big tablet-show" style="order: 2"></div>
    <div class="spacer tablet-show" style="order: 4"></div>
    @for (_ of cells; track _) {
      <div class="tablet-hide"></div>
    }
  </div>
}
