<!-- Componente de lista de imágenes de cada sección -->
<div class="spacer"></div>
<div class="images-grid">
  @for (img of images; track img) {
    <div class="images-item">
      <img [src]="img.url_thumbnail" [alt]="img.alt" />
      <div class="images-item-info">
        <div class="oneColumn">
          <p>{{ img.alt }}</p>
        </div>
        <p style="flex-grow: 1;"><strong>Orden:</strong> {{ img.orden }}</p>
        <div style="display: flex; flex-grow: 1; justify-content: center;"><button mat-button
          (click)="deleteImage(img.id)"><mat-icon>delete</mat-icon></button></div>
        </div>
      </div>
    }
  </div>
